; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32doit-devkit-v1

; Shared settings for all ESP32 environments
[esp32_base]
platform = espressif32
framework = arduino
monitor_speed = 115200
build_flags =
	-Wall
	-Wextra
	-Wno-unused-parameter
lib_deps =
	adafruit/Adafruit ADS1X15@~2.4.2
	adafruit/Adafruit MCP23017 Arduino Library@^2.3.2
	robtillaart/MCP23S17@^0.5.2

; Static analysis configuration
check_tool = cppcheck
check_skip_packages = yes
check_flags =
	cppcheck: --enable=warning,performance,portability --suppress=missingIncludeSystem --inline-suppr
check_src_filters =
	+<src/>

; === Produktion ===
[env:esp32doit-devkit-v1]
extends = esp32_base
board = esp32doit-devkit-v1
test_filter = test_embedded/*

; === Native Tests (Host-PC, kein Board noetig) ===
[env:native]
platform = native
test_framework = googletest
test_build_src = true
build_flags =
	-std=gnu++17
	-DNATIVE_BUILD
	-Itest/stubs
test_filter = test_native
lib_deps =
	google/googletest@^1.17.0
build_src_filter =
	+<crc8.cpp>

